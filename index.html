  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #0d1322 !important;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background-color: #172033;
      border-radius: 28px;
      padding: 32px 20px 24px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: auto;
    }

    .direct-link {
      text-decoration: none;
      color: inherit;
      display: block;
      width: 100%;
    }

    .profile-wrapper {
      position: relative;
      width: 135px;
      height: 135px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .profile-ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      padding: 4px;
      background: #ff0000;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.8), inset 0 0 15px rgba(255, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse-red 2s infinite alternate;
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 15px rgba(255, 0, 0, 0.7); }
      100% { box-shadow: 0 0 30px rgba(255, 0, 0, 1); }
    }

    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .user-name-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .user-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #ffffff;
    }

    .verified-badge {
      background-color: #10b981;
      color: #ffffff;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .percent-badge {
      background-color: #059669;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
    }

    .stats-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .rating {
      color: #f59e0b;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .rating span {
      color: #cbd5e1;
      font-weight: 400;
    }

    .views {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #cbd5e1;
    }

    .dot-separator {
      width: 4px;
      height: 4px;
      background-color: #64748b;
      border-radius: 50%;
    }

    .action-boxes {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .action-card {
      background-color: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.2s ease, background-color 0.2s ease;
      cursor: pointer;
    }

    .action-card:active {
      transform: scale(0.98);
      background-color: #334155;
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
    }

    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .icon-video {
      background-color: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    .icon-chat {
      background-color: rgba(168, 85, 247, 0.15);
      color: #a855f7;
    }

    .icon-call {
      background-color: rgba(16, 185, 129, 0.15);
      color: #10b981;
    }

    .card-text .title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 3px;
    }

    .card-text .subtitle {
      font-size: 13px;
      color: #94a3b8;
    }

    .arrow-box {
      width: 38px;
      height: 38px;
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 14px;
      flex-shrink: 0;
    }

    .footer-text {
      margin-top: 28px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
